services:
  - type: web
    name: sentinel-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: sentinel-db
    region: oregon
    plan: free
    databaseName: sentinel_store
    user: sentinel_admin
